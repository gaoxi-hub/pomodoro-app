name: pomodoro
description: 番茄钟 App — Flutter 原生版本（暗黑沉浸 + 荧光薄荷绿发光）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1
  audioplayers: ^6.1.0
  uuid: ^4.4.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
